# nginx site for EliteForces. install.sh copies this to
# /etc/nginx/sites-available/eliteforces, filling in __DOMAIN__,
# and certbot then adds HTTPS and the http → https redirect.
#
# There is deliberately no "root": every request goes to the game, so the
# code in the app folder (including .git) is never served as files.

# www.__DOMAIN__ → __DOMAIN__
server {
    listen 80;
    listen [::]:80;
    server_name www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
